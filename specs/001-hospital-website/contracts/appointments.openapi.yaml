openapi: 3.0.3
info:
  title: Hospital Website - Appointments API
  version: 1.0.0
  description: API for managing patient appointment bookings

paths:
  /api/appointments:
    post:
      summary: Create new appointment booking
      description: Books an appointment for a patient with a specific doctor
      tags:
        - Appointments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientName
                - patientPhone
                - patientEmail
                - doctorId
                - appointmentDate
                - appointmentTime
              properties:
                patientName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "John Doe"
                patientPhone:
                  type: string
                  pattern: '^\+?[1-9]\d{9,14}$'
                  example: "+1-555-1234"
                patientEmail:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                reasonForVisit:
                  type: string
                  maxLength: 500
                  example: "Regular checkup"
                doctorId:
                  type: string
                  example: "clu123abc456"
                appointmentDate:
                  type: string
                  format: date
                  example: "2024-03-15"
                appointmentTime:
                  type: string
                  pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                  example: "10:00"
      responses:
        '201':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Time slot already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get appointments (admin only)
      description: Retrieve list of appointments with filters
      tags:
        - Appointments
      parameters:
        - name: doctorId
          in: query
          schema:
            type: string
          description: Filter by doctor ID
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
          description: Filter by status
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by appointment date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentResponse'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/appointments/{id}:
    get:
      summary: Get appointment by ID
      tags:
        - Appointments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '404':
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update appointment status (admin only)
      tags:
        - Appointments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [confirmed, cancelled, completed]
                notes:
                  type: string
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  /api/appointments/available-slots:
    get:
      summary: Get available time slots for a doctor
      tags:
        - Appointments
      parameters:
        - name: doctorId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available time slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  doctorId:
                    type: string
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          example: "10:00"
                        available:
                          type: boolean

components:
  schemas:
    AppointmentResponse:
      type: object
      properties:
        id:
          type: string
          example: "clu123abc456"
        patientName:
          type: string
        patientPhone:
          type: string
        patientEmail:
          type: string
        reasonForVisit:
          type: string
        appointmentDate:
          type: string
          format: date-time
        appointmentTime:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
        doctor:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            specialty:
              type: string
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
